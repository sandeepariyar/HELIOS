<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#060d16">
  <meta name="description" content="HELIOS energy management cockpit, designed in Figma and developed by Sandeep Pariyar in Qt 6, QML and C++. The live app runs in WebAssembly inside an embedded HMI demonstration frame.">
  <title>HELIOS — Live Qt 6 Energy Cockpit | Sandeep Pariyar</title>
  <style>
    :root { color-scheme: dark; --stage-scale: 1; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 52% 40%, #183044 0%, #0a1521 48%, #04080e 100%);
      color: #d6e9f5;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    }
    #device {
      position: absolute; top: 50%; left: 50%; width: 1366px; height: 873px;
      overflow: hidden; transform: translate(-50%, -50%) scale(var(--stage-scale));
      transform-origin: center center; isolation: isolate;
      filter: drop-shadow(0 18px 28px rgba(0,0,0,.5));
    }
    #hardware {
      position: absolute; left: -28px; top: -92px;
      width: 1448px; height: 1086px; display: block;
      pointer-events: none; user-select: none; -webkit-user-drag: none;
    }
    /* Pixel-measured black LCD opening in the 1448 x 1086 straight-on HMI art.
       Image offset: (-28, -92). Only the outer MCU stage scales with the browser.
       Qt itself runs inside a true untransformed 840x520 iframe viewport. */
    #lcdViewport {
      position: absolute;
      left: 120px; top: 78px; width: 1150px; height: 654px;
      overflow: hidden; background: #06090e; isolation: isolate;
    }
    /* An iframe is essential: Qt for WebAssembly measures its host element as
       a QScreen. Transforming the host div directly caused QScreen/window
       geometry mismatch and clipped the right edge of the native interface.
       The iframe keeps Qt's own CSS viewport at exactly 840x520 and the
       browser fits those pixels to the measured LCD aperture. */
    #qtFrame {
      position: absolute; inset: 0;
      width: 840px; height: 520px; border: 0; display: block;
      transform-origin: 0 0;
      transform: scale(1.369047619047619, 1.257692307692308);
      opacity: 0; pointer-events: none; background: #050911;
    }
    #qtspinner {
      position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2;
      background: radial-gradient(ellipse at center, #0f2938, #04090f 65%);
      display: flex; justify-content: center; align-items: center;
      flex-direction: column; gap: 17px; border: 1px solid #213c4b;
      text-align: center;
    }
    #qtspinner .logo { color: #12cee1; font-size: 43px; line-height: 1; }
    #qtspinner h1 { margin: 0; font-size: 31px; letter-spacing: .35em; }
    #qtspinner .sub { color: #70afc5; font-size: 12px; letter-spacing: .12em; }
    #qtspinner .credit { color: #628598; font-size: 10px; }
    .meter { width: 290px; height: 3px; background: #203a49; overflow: hidden; }
    .meter::before { content: ""; display: block; width: 45%; height: 100%;
      background: #19d8db; animation: drift 1.35s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(-100%); } to { transform: translateX(350%); } }
    #qtstatus { min-height: 30px; max-width: 710px; font-size: 11px; color: #8ca7b8; }
    button { font-family: inherit; cursor: pointer; }
    #retry { display: none; padding: 9px 20px; color: #081824; background: #20d2dc;
      border: 0; border-radius: 4px; font-weight: bold; }
    /* Tiny speaker set into the top-right HARDWARE bezel, not a floating page
       widget. It shares the MCU stage transform and never covers the live LCD. */
    #audioToggle {
      position: absolute; left: 1220px; top: 32px; z-index: 6;
      display: grid; place-items: center;
      width: 34px; height: 30px; padding: 0;
      border: 1px solid #3d6275; border-radius: 5px;
      background: #0c1c28e8; color: #50decf;
      box-shadow: inset 0 1px #ffffff12, 0 1px 5px #0009;
      touch-action: manipulation;
      transition: border-color .15s ease, color .15s ease, background .15s ease;
    }
    #audioToggle:hover { background: #142a39; border-color: #4aa6b5; }
    #audioToggle.locked { color: #80b9bf; }
    #audioToggle.muted { color: #7b899b; border-color: #364350; }
    #audioToggle:focus-visible, #retry:focus-visible {
      outline: 2px solid #58e7ff; outline-offset: 3px;
    }
    #audioToggle svg { width: 18px; height: 18px; pointer-events: none; }
    #audioToggle #muteLine { display: none; }
    #audioToggle.muted #soundWaves { display: none; }
    #audioToggle.muted #muteLine { display: block; }
    #footer { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      white-space: nowrap; color: #6d8b9b; font-size: 10px; letter-spacing: .08em; }
    @media (max-width: 850px) { #footer { display: none; } }
    @media (prefers-reduced-motion: reduce) { .meter::before { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <main id="device" aria-label="HELIOS live energy cockpit embedded in an MCU-style hardware frame">
    <img id="hardware" src="helios-mcu-frame.webp" width="1448" height="1086"
      alt="Front-facing HELIOS embedded touchscreen enclosure" draggable="false">
    <div id="lcdViewport" aria-label="Physical MCU LCD aperture">
      <iframe id="qtFrame" title="Interactive HELIOS Qt 6 WebAssembly simulator"
        src="qt-host.html" width="840" height="520" scrolling="no"
        loading="eager" allow="autoplay"></iframe>
      <section id="qtspinner" aria-live="polite" aria-label="Loading HELIOS">
      <div class="logo" aria-hidden="true">ϟ</div>
      <h1>HELIOS</h1>
      <div class="sub">LOADING ACTUAL QT 6 / QML / C++ WEBASSEMBLY</div>
      <div class="meter" id="loadMeter"></div>
      <div id="qtstatus">INITIALIZING ENERGY SYSTEM</div>
      <button id="retry" type="button" onclick="location.reload()">RETRY</button>
      <div class="credit">DESIGNED &amp; DEVELOPED BY SANDEEP PARIYAR</div>
    </section>
    </div>
    <button id="audioToggle" type="button" class="locked" aria-pressed="true"
      aria-label="Mute HELIOS sound" title="Sound on — activates with the first click or tap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
        <g id="soundWaves"><path d="M15 9a4.5 4.5 0 0 1 0 6"/>
        <path d="M18 6a8.5 8.5 0 0 1 0 12"/></g>
        <path id="muteLine" d="m16 10 5 5m0-5-5 5"/>
      </svg>
    </button>
  </main>
  <div id="footer">HELIOS · FIGMA DESIGN · QML / C++ IMPLEMENTATION · SANDEEP PARIYAR</div>
  <script>
  (() => {
    // Qt WASM does not require Qt Multimedia. These are the existing original
    // short WAV effects, streamed/decoded by browser Web Audio on user gesture.
    const filenames = ['confirm.wav', 'warning.wav', 'trip.wav'];
    const audioToggle = document.getElementById('audioToggle');

    // Sound is logically ON from the start. AudioContext.resume() requires a
    // user gesture; the first pointer/key interaction anywhere on the device
    // (including inside the Qt iframe) activates Web Audio automatically.
    const audio = {
      ctx: null, enabled: false, muted: false,
      buffers: [], rawPromise: null, unlockPromise: null,
      pending: [], playCalls: 0, playedSounds: 0,

      preload() {
        if (!this.rawPromise) {
          this.rawPromise = Promise.all(filenames.map(async name => {
            const res = await fetch('sounds/' + name);
            if (!res.ok) throw new Error(name + ': HTTP ' + res.status);
            return res.arrayBuffer();
          }));
          this.rawPromise.catch(e => console.warn('HELIOS_AUDIO_PRELOAD_ERROR:', e));
        }
        return this.rawPromise;
      },

      unlockFromGesture() {
        if (this.muted || this.enabled) return this.unlockPromise;
        // Create and resume INSIDE the user event stack, before awaiting.
        if (!this.ctx) {
          const API = window.AudioContext || window.webkitAudioContext;
          if (!API) { console.warn('HELIOS_AUDIO: Web Audio unavailable'); return null; }
          this.ctx = new API();
        }
        const resumed = this.ctx.resume();
        if (!this.unlockPromise) {
          this.unlockPromise = Promise.all([resumed, this.preload()])
            .then(async ([, raw]) => {
              this.buffers = await Promise.all(raw.map(b => this.ctx.decodeAudioData(b.slice(0))));
              this.enabled = true;
              const queued = this.pending.splice(0);
              for (const event of queued) {
                if (Date.now() - event.at < 1500 && !this.muted)
                  this.play(event.kind, event.volume);
              }
              renderAudioState();
              console.info('HELIOS_AUDIO_READY: Original WAV effects unlocked by first interaction');
              return true;
            })
            .catch(e => {
              this.unlockPromise = null;
              console.warn('HELIOS_AUDIO_ERROR:', e);
              return false;
            });
        }
        return this.unlockPromise;
      },

      play(kind, volume) {
        if (this.muted) return;
        if (!this.enabled || !this.ctx || this.ctx.state !== 'running' ||
            this.buffers.length !== 3) {
          this.pending.push({kind, volume, at: Date.now()});
          if (this.pending.length > 4) this.pending.shift();
          return;
        }
        const index = Math.max(0, Math.min(2, Number(kind) | 0));
        const buffer = this.buffers[index];
        if (!buffer) return;
        this.playCalls++;
        try {
          const source = this.ctx.createBufferSource();
          const gain = this.ctx.createGain();
          gain.gain.value = Math.max(0, Math.min(1, Number(volume) || 0));
          source.buffer = buffer;
          source.connect(gain); gain.connect(this.ctx.destination);
          source.start();
          this.playedSounds++;
        } catch (e) { console.warn('HELIOS_AUDIO_ERROR:', e); }
      }
    };
    window.heliosAudio = audio;
    audio.preload();

    const renderAudioState = () => {
      const isOn = !audio.muted;
      audioToggle.classList.toggle('muted', !isOn);
      audioToggle.classList.toggle('locked', isOn && !audio.enabled);
      audioToggle.setAttribute('aria-pressed', String(isOn));
      audioToggle.setAttribute('aria-label', isOn ? 'Mute HELIOS sound' : 'Enable HELIOS sound');
      audioToggle.title = !isOn ? 'Sound muted — click to enable' :
        (audio.enabled ? 'Sound on — click to mute' : 'Sound on — first tap enables browser audio');
    };

    // Parent page gestures (hardware/bezel/background) unlock automatically.
    // Skip the audio button; it has its own explicit mute/unmute handler.
    document.addEventListener('pointerdown', e => {
      if (!audioToggle.contains(e.target)) audio.unlockFromGesture();
    }, {capture:true});
    document.addEventListener('keydown', e => {
      if (!audioToggle.contains(e.target) && !e.repeat)
        audio.unlockFromGesture();
    }, {capture:true});
    audioToggle.addEventListener('click', () => {
      if (audio.muted) {
        audio.muted = false;
        audio.unlockFromGesture();
      } else if (!audio.enabled) {
        audio.unlockFromGesture();
      } else {
        audio.muted = true;
        audio.pending.length = 0;
      }
      renderAudioState();
    });
    renderAudioState();

    const stage = document.getElementById('device');
    const fit = () => {
      const scale = Math.max(.18, Math.min(1.34, (innerWidth - 34) / 1366, (innerHeight - 35) / 873));
      document.documentElement.style.setProperty('--stage-scale', scale.toFixed(5));
    };
    addEventListener('resize', fit);
    fit();
    const frame = document.getElementById('qtFrame');
    const spinner = document.getElementById('qtspinner');
    const status = document.getElementById('qtstatus');
    const retry = document.getElementById('retry');
    const meter = document.getElementById('loadMeter');
    let loaded = false;
    const fail = message => {
      frame.style.opacity = '0';
      frame.style.pointerEvents = 'none';
      spinner.style.display = 'flex';
      retry.style.display = 'inline-block';
      meter.style.display = 'none';
      status.textContent = message;
    };
    window.addEventListener('message', e => {
      // Ignore foreign frames: only the same-origin Qt iframe can update status.
      if (e.origin !== location.origin || e.source !== frame.contentWindow) return;
      const msg = e.data;
      if (!msg || typeof msg !== 'object') return;
      if (msg.type === 'HELIOS_WASM_READY') {
        loaded = true;
        frame.style.opacity = '1';
        frame.style.pointerEvents = 'auto';
        spinner.style.display = 'none';
        fit();
        console.info('HELIOS_VIEWPORT_READY: Native 840x520 QML viewport mounted inside LCD.');
      } else if (msg.type === 'HELIOS_WASM_EXIT') {
        fail('QT APPLICATION EXITED: ' + String(msg.detail || 'unknown'));
      } else if (msg.type === 'HELIOS_WASM_ERROR') {
        console.error('HELIOS_WASM_ERROR:', msg.detail);
        fail('QT RUNTIME ERROR: ' + String(msg.detail || 'unknown'));
      }
    });
    frame.addEventListener('error', () => fail('QT WEBASSEMBLY FRAME FAILED TO LOAD'));
    window.addEventListener('error', e => console.error('HELIOS_WEB_ERROR:', e.message));
    setTimeout(() => {
      if (!loaded && retry.style.display === 'none')
        status.textContent = 'LOADING QT RUNTIME · FIRST LAUNCH CAN TAKE LONGER';
    }, 9000);
  })();
  </script>
</body>
</html>
